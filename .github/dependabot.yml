version: 2

# The actions the workflow calls, and the Python packages the lock files pin.
# The cooldown is the house rule that no third-party release is used inside
# seven days of being published; it holds for both of these ecosystems
# because PyPI and GitHub both tell Dependabot when a version came out.
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
    open-pull-requests-limit: 3

  # requirements.txt, requirements-dev.txt and requirements-build.txt name
  # every package with an exact version and its hashes, written by
  # scripts/lock_hashes.py. Dependabot rewrites the --hash lines along with
  # the version, which is the only thing that keeps a hash pin from being a
  # pin that never moves again.
  #
  # Nothing resolves those files, so nothing else knows that PySide6 pins its
  # two halves and shiboken6 to its own version. Moved one at a time, each
  # pull request would fail the install; grouped, the four move in one.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps"
    open-pull-requests-limit: 3
    groups:
      pyside:
        patterns: ["pyside6*", "shiboken6"]
